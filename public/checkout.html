<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plaćanje | Zmajeva Jazbina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="container mx-auto px-4 py-10 max-w-4xl">
        <h1 class="text-3xl font-bold mb-8 text-center">Završetak Kupovine</h1>

        <div class="flex flex-col md:flex-row gap-8">
            
            <!-- FORMULAR -->
            <div class="w-full md:w-2/3 bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-6 border-b pb-2">Podaci za dostavu</h2>
                <form id="checkout-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">Ime i Prezime</label>
                        <input type="text" id="full-name" required class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">Grad</label>
                            <input type="text" id="city" required class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-600 mb-1">Poštanski broj</label>
                            <input type="text" id="zip" required class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">Adresa i broj</label>
                        <input type="text" id="address" required class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">Telefon (za kurira)</label>
                        <input type="tel" id="phone" required class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-1">Email</label>
                        <input type="email" id="email" required class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div class="pt-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="payment" checked class="text-indigo-600 focus:ring-indigo-500">
                            <span class="font-bold">Plaćanje pouzećem (keš kuriru)</span>
                        </label>
                    </div>

                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg mt-6 transition transform hover:scale-[1.01]">
                        Potvrdi Narudžbinu
                    </button>
                </form>
            </div>

            <!-- PREGLED KORPE (SAŽETO) -->
            <div class="w-full md:w-1/3">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 sticky top-10">
                    <h3 class="font-bold text-lg mb-4">Vaša Korpa</h3>
                    <div id="checkout-summary" class="space-y-3 mb-4 max-h-60 overflow-y-auto pr-2">
                        <!-- JS ubacuje stavke ovde -->
                        <p class="text-slate-400 text-sm">Učitavanje...</p>
                    </div>
                    <div class="border-t pt-4 flex justify-between items-center text-xl font-bold">
                        <span>Ukupno:</span>
                        <span id="checkout-total" class="text-indigo-600">0 RSD</span>
                    </div>
                    <a href="cart.html" class="block text-center text-indigo-600 text-sm font-bold mt-4 hover:underline">Izmeni korpu</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="js/script.js"></script>
    <script>
        // Inline skripta specifična samo za checkout stranicu
        document.addEventListener('DOMContentLoaded', () => {
            loadCheckoutSummary();
            
            document.getElementById('checkout-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await processOrder();
            });
        });

        async function loadCheckoutSummary() {
            const container = document.getElementById('checkout-summary');
            const totalEl = document.getElementById('checkout-total');
            const sessionId = localStorage.getItem('user_session_id');

            try {
                const res = await fetch(`/api/cart/${sessionId}`);
                const items = await res.json();
                
                if(items.length === 0) {
                    alert("Korpa je prazna!");
                    window.location.href = 'shop.html';
                    return;
                }

                container.innerHTML = '';
                let total = 0;

                items.forEach(item => {
                    const price = item.discount_price || item.price;
                    total += price * item.quantity;
                    container.innerHTML += `
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-600">${item.quantity}x ${item.name}</span>
                            <span class="font-bold">${(price * item.quantity).toLocaleString()}</span>
                        </div>
                    `;
                });
                totalEl.innerText = total.toLocaleString() + " RSD";
            } catch (e) { console.error(e); }
        }

        async function processOrder() {
            const customer = {
                fullName: document.getElementById('full-name').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                zip: document.getElementById('zip').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value
            };

            const sessionId = localStorage.getItem('user_session_id');
            // Provera da li je ulogovan (za user_id) - ovo radimo preko API-ja, ali 
            // za sada ćemo poslati zahtev, server će uzeti user_id iz sesije ako postoji.
            
            // Ali čekaj, session_id nam treba.
            // Moramo pitati server "ko sam ja" da bi dobili ID korisnika za bazu, 
            // ili server to već zna iz cookie-ja. Server zna.
            
            // Da bismo povezali user_id, moramo ga poslati ako ga imamo, 
            // ili server da ga izvuče iz req.session. 
            // Najbolje da server to uradi iz req.session.
            
            // Ažuriraćemo server endpoint da čita user_id iz sesije.
            // Trenutni server kod gore očekuje user_id u body-ju, hajde da to popravimo u JS-u
            
            let userId = null;
            try {
                const authRes = await fetch('/api/check-auth');
                const authData = await authRes.json();
                // API /check-auth trenutno ne vraća ID, samo username. 
                // Nema veze, poslaćemo NULL, a server neka proba da nađe iz sesije ako može.
                // Za sad, hajde da se oslonimo na to da server koristi req.session.userId
                // Ali u kodu gore sam napisao: const { session_id, user_id, customer } = req.body;
                // Moramo to uskladiti.
            } catch(e) {}

            try {
                const res = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        customer: customer
                        // user_id server treba da izvuče iz sesije
                    })
                });

                const data = await res.json();

                if (data.success) {
                    alert("Hvala na kupovini! Vaša narudžbina je primljena.");
                    window.location.href = 'index.html';
                } else {
                    alert("Greška: " + data.error);
                }
            } catch (e) {
                alert("Greška na serveru.");
            }
        }
    </script>
</body>
</html>
