<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija | Zmajeva Jazbina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-slate-800">Kreiraj nalog</h1>
            <p class="text-slate-500">Pridruži se zajednici</p>
        </div>

        <form id="register-form" class="space-y-4">
            <!-- Korisničko ime -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Korisničko ime</label>
                <input type="text" id="username" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition">
            </div>
            
            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email Adresa</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition">
            </div>
            
            <!-- Lozinka -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Lozinka</label>
                <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition">
            </div>

            <!-- Potvrdi Lozinku (NOVO POLJE) -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Potvrdi Lozinku</label>
                <input type="password" id="confirm_password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none transition placeholder-slate-400" placeholder="Unesite istu lozinku ponovo">
            </div>

            <!-- Poruka o grešci/uspehu -->
            <div id="msg" class="text-sm hidden text-center font-bold p-2 rounded bg-red-50 text-red-600 border border-red-200"></div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition shadow-lg mt-2">
                Registruj se
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
            Već imaš nalog? <a href="login.html" class="text-indigo-600 font-bold hover:underline">Prijavi se</a>
        </p>
        <p class="mt-2 text-center text-sm">
            <a href="index.html" class="text-slate-400 hover:text-slate-600">Nazad na početnu</a>
        </p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 1. Prikupljanje podataka
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const msg = document.getElementById('msg');

            // Resetuj poruku
            msg.classList.add('hidden');
            msg.className = "text-sm hidden text-center font-bold p-2 rounded"; // Reset klasa

            // 2. PROVERA: Da li se lozinke poklapaju?
            if (password !== confirmPassword) {
                msg.innerText = "❌ Lozinke se ne poklapaju! Pokušajte ponovo.";
                msg.className = "text-sm text-center font-bold p-2 rounded bg-red-50 text-red-600 border border-red-200 block mb-4";
                return; // Prekida slanje serveru
            }

            // 3. PROVERA: Dužina lozinke (opciono, ali poželjno)
            if (password.length < 6) {
                msg.innerText = "❌ Lozinka mora imati bar 6 karaktera.";
                msg.className = "text-sm text-center font-bold p-2 rounded bg-red-50 text-red-600 border border-red-200 block mb-4";
                return;
            }

            // 4. Slanje na server (Ako je sve OK)
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                msg.classList.remove('hidden');
                
                if (data.success) {
                    // Uspeh
                    msg.className = "text-sm text-center font-bold p-2 rounded bg-green-50 text-green-600 border border-green-200 block mb-4";
                    msg.innerText = "✅ Uspešna registracija! Preusmeravanje...";
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    // Greška sa servera (npr. zauzet email)
                    msg.className = "text-sm text-center font-bold p-2 rounded bg-red-50 text-red-600 border border-red-200 block mb-4";
                    msg.innerText = "⚠️ " + data.error;
                }
            } catch (err) {
                msg.classList.remove('hidden');
                msg.className = "text-sm text-center font-bold p-2 rounded bg-red-50 text-red-600 border border-red-200 block mb-4";
                msg.innerText = "❌ Greška u komunikaciji sa serverom.";
            }
        });
    </script>
</body>
</html>
