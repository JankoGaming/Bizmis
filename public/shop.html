<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zmajeva Jazbina | Shop</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"> 

    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-100">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-indigo-600 text-white p-2 rounded-lg"><i class="fa-solid fa-dragon text-xl"></i></div>
                <span class="text-xl font-bold tracking-tight text-slate-900">Zmajeva<span class="text-indigo-600">Jazbina</span></span>
            </a>
            
            <div class="hidden md:flex space-x-8 font-medium text-sm text-slate-600">
                <a href="index.html" class="hover:text-indigo-600 transition">Početna</a>
                <a href="shop.html" class="text-indigo-600 font-bold">Prodavnica</a>
            </div>

            <div class="flex items-center space-x-4">
                <a href="cart.html" class="relative group cursor-pointer">
                    <i class="fa-solid fa-cart-shopping text-xl text-slate-600 group-hover:text-indigo-600 transition"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] rounded-full h-4 w-4 flex items-center justify-center font-bold">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container mx-auto px-4 py-8 flex-grow">
        <!-- TABS -->
        <div class="flex justify-center mb-10 border-b border-slate-200 overflow-x-auto">
            <button onclick="switchTab('all')" class="tab-btn active px-6 py-3 font-semibold text-slate-500 hover:text-indigo-600 flex items-center gap-2 whitespace-nowrap" data-tab="all">
                <i class="fa-solid fa-layer-group"></i> Sve
            </button>
            <button onclick="switchTab('boardgame')" class="tab-btn px-6 py-3 font-semibold text-slate-500 hover:text-indigo-600 flex items-center gap-2 whitespace-nowrap" data-tab="boardgame">
                <i class="fa-solid fa-dice-d20"></i> Društvene Igre
            </button>
            <button onclick="switchTab('tcg')" class="tab-btn px-6 py-3 font-semibold text-slate-500 hover:text-indigo-600 flex items-center gap-2 whitespace-nowrap" data-tab="tcg">
                <i class="fa-solid fa-scroll"></i> TCG
            </button>
            <button onclick="switchTab('equipment')" class="tab-btn px-6 py-3 font-semibold text-slate-500 hover:text-indigo-600 flex items-center gap-2 whitespace-nowrap" data-tab="equipment">
                <i class="fa-solid fa-shield-halved"></i> Oprema
            </button>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- SIDEBAR -->
            <aside class="w-full lg:w-1/4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit lg:sticky lg:top-24">
                <div class="flex justify-between items-center mb-6 lg:hidden">
                    <h2 class="font-bold text-lg">Filteri</h2>
                    <button id="toggle-filters" class="text-indigo-600"><i class="fa-solid fa-chevron-down"></i></button>
                </div>
                <div id="filter-container" class="space-y-8 hidden lg:block">
                    <!-- SEARCH -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Pretraga</label>
                        <div class="relative">
                            <input type="text" id="search-input" placeholder="npr. Catan..." class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-slate-50">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        </div>
                    </div>
                    <!-- PRICE -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Cena (max: <span id="price-val" class="text-indigo-600">25.000</span>)</label>
                        <input type="range" id="price-range" min="0" max="25000" step="500" value="25000">
                    </div>
                    <!-- FILTER CHECKBOXES -->
                    <div>
                         <h3 class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Težina</h3>
                         <div class="space-y-2">
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="checkbox" class="filter-complexity rounded text-indigo-600" value="lako"><span class="text-sm">Lako</span></label>
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="checkbox" class="filter-complexity rounded text-indigo-600" value="srednje"><span class="text-sm">Srednje</span></label>
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="checkbox" class="filter-complexity rounded text-indigo-600" value="tesko"><span class="text-sm">Teško</span></label>
                         </div>
                    </div>
                    <div>
                         <h3 class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Igrači</h3>
                         <div class="space-y-2">
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="checkbox" class="filter-players rounded text-indigo-600" value="2"><span class="text-sm">2 Igrača</span></label>
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="checkbox" class="filter-players rounded text-indigo-600" value="3-5"><span class="text-sm">3-5 Igrača</span></label>
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="checkbox" class="filter-players rounded text-indigo-600" value="6+"><span class="text-sm">6+ Igrača</span></label>
                         </div>
                    </div>

                    <button id="reset-filters" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2"><i class="fa-solid fa-rotate-right"></i> Poništi sve</button>
                </div>
            </aside>

            <!-- PRODUCT GRID -->
            <main class="w-full lg:w-3/4">
                <div class="flex justify-between items-center mb-6">
                    <p class="text-slate-500 text-sm"><span id="results-count" class="font-bold text-slate-900">0</span> rezultata</p>
                    <div class="relative">
                        <select id="sort-select" class="appearance-none bg-white border border-slate-200 pl-4 pr-10 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                            <option value="default">Preporučeno</option>
                            <option value="price-asc">Cena: Najniža</option>
                            <option value="price-desc">Cena: Najviša</option>
                            <option value="rating">Ocena</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-xs text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <div id="loader" class="hidden flex justify-center py-20"><div class="loader"></div></div>
                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>
                <div id="no-results" class="hidden flex flex-col items-center justify-center py-20 text-center"><i class="fa-solid fa-ghost text-4xl text-slate-400 mb-4"></i><h3 class="text-lg font-bold text-slate-700">Nema rezultata</h3></div>
            </main>
        </div>
    </div>

    <!-- MODAL -->
    <div id="product-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white w-full max-w-5xl max-h-[90vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
            <!-- X DUGME (Sad ima samo onclick="closeModal()") -->
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 bg-white/80 hover:bg-white text-slate-500 hover:text-slate-800 rounded-full p-2 transition backdrop-blur-md">
                <i class="fa-solid fa-xmark text-xl w-6 h-6 flex items-center justify-center"></i>
            </button>

            <div class="w-full md:w-1/2 bg-slate-50 flex items-center justify-center p-8 relative">
                <img id="modal-img" src="" referrerpolicy="no-referrer" class="max-h-[50vh] object-contain drop-shadow-xl z-10" onerror="this.src='https://placehold.co/400x400?text=Nema+Slike'">
            </div>
            <div class="w-full md:w-1/2 p-8 overflow-y-auto bg-white flex flex-col">
                <div class="mb-6">
                    <div class="flex items-center gap-2 mb-3">
                        <span id="modal-type" class="text-[10px] font-bold uppercase tracking-widest px-2 py-1 rounded bg-slate-100 text-slate-600">Board Game</span>
                        <div class="flex items-center text-yellow-400 text-sm bg-yellow-50 px-2 py-1 rounded-full"><i class="fa-solid fa-star mr-1"></i> <span id="modal-rating" class="font-bold text-slate-700">0.0</span></div>
                    </div>
                    <h2 id="modal-title" class="text-3xl font-bold text-slate-900 leading-tight">Naslov Igre</h2>
                    <div class="mt-2 text-2xl font-bold text-indigo-600" id="modal-price">0 RSD</div>
                </div>

                <div id="modal-specs" class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-users text-xs"></i></div><div><p class="text-[10px] text-slate-400 uppercase font-bold">Igrači</p><p class="text-sm font-semibold text-slate-700" id="modal-players">-</p></div></div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center"><i class="fa-regular fa-clock text-xs"></i></div><div><p class="text-[10px] text-slate-400 uppercase font-bold">Vreme</p><p class="text-sm font-semibold text-slate-700" id="modal-time">-</p></div></div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-pink-100 text-pink-600 flex items-center justify-center"><i class="fa-solid fa-child text-xs"></i></div><div><p class="text-[10px] text-slate-400 uppercase font-bold">Uzrast</p><p class="text-sm font-semibold text-slate-700" id="modal-age">-</p></div></div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center"><i class="fa-solid fa-brain text-xs"></i></div><div><p class="text-[10px] text-slate-400 uppercase font-bold">Težina</p><p class="text-sm font-semibold text-slate-700" id="modal-complexity">-</p></div></div>
                </div>

                <div class="prose prose-sm mb-6 text-slate-600"><p id="modal-desc">Opis...</p></div>
                <div id="modal-video-container" class="mb-6 rounded-xl overflow-hidden shadow-lg hidden"><iframe id="modal-iframe" class="w-full h-48" src="" frameborder="0" allowfullscreen></iframe></div>
                
                <div class="mt-auto pt-4 border-t border-slate-100">
                    <!-- OVDE JE PROMENA: Dodat id="modal-add-btn" -->
                    <button id="modal-add-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl flex justify-center items-center gap-2">
                        <i class="fa-solid fa-cart-plus"></i> Dodaj u korpu
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="notification-toast" class="fixed bottom-5 right-5 z-[100] transform transition-all duration-300 translate-y-24 opacity-0">
        <div class="bg-slate-800 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3">
            <i class="fa-solid fa-circle-check text-green-400 text-xl"></i>
            <span id="notification-message" class="font-medium">Poruka</span>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
